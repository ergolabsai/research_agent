[project]
name = "research-advisor"
version = "0.1.0"
description = "Multi-agent research paper validation system"
requires-python = ">=3.11"
dependencies = [
    # LLM & AI
    "anthropic>=0.40.0",
    "instructor>=1.0.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",

    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlmodel>=0.0.22",
    "pymongo>=4.8.0",

    # Auth & Security
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.1",

    # Data & Validation
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # MCP Server
    "mcp>=1.0.0",
    "sympy>=1.13.0",

    # Citation checking
    "httpx>=0.27.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "tzdata>=2024.1",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "advisor_pipeline*"]
exclude = ["frontend*", "node_modules*", "scripts*"]
