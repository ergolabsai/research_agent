# =============================================================================
# Docker Compose — Production (CPU)
# =============================================================================
# Usage:
#   docker compose -f docker/docker-compose.yml up -d
#
# Layer with overrides:
#   Dev:  docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml up
#   GPU:  docker compose -f docker/docker-compose.yml -f docker/docker-compose.gpu.yml up
#   Both: docker compose -f docker/docker-compose.yml -f docker/docker-compose.dev.yml -f docker/docker-compose.gpu.yml up
# =============================================================================

name: advisor

services:
  # ---------------------------------------------------------------------------
  # API — FastAPI backend
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: docker/python.Dockerfile
      target: api
      args:
        API_PORT: ${API_PORT:-8070}
    ports:
      - "${API_PORT:-8070}:${API_PORT:-8070}"
    env_file:
      - ../.env
    volumes:
      - app_data:/app/backend/data
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Frontend — React SPA served by nginx
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      target: prod
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Streamlit — LanceDB Navigator
  # ---------------------------------------------------------------------------
  streamlit:
    build:
      context: ..
      dockerfile: docker/python.Dockerfile
      target: streamlit
      args:
        STREAMLIT_PORT: ${STREAMLIT_PORT:-8511}
    ports:
      - "${STREAMLIT_PORT:-8511}:${STREAMLIT_PORT:-8511}"
    env_file:
      - ../.env
    volumes:
      - app_data:/app/backend/data:ro
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Calculator — MCP Calculator Server (SSE transport)
  # ---------------------------------------------------------------------------
  calculator:
    build:
      context: ..
      dockerfile: docker/python.Dockerfile
      target: calculator
      args:
        CALCULATOR_PORT: ${CALCULATOR_PORT:-8000}
    ports:
      - "${CALCULATOR_PORT:-8000}:${CALCULATOR_PORT:-8000}"
    env_file:
      - ../.env
    volumes:
      - app_data:/app/backend/data
    restart: unless-stopped

volumes:
  app_data:
    driver: local
